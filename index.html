<!DOCTYPE html>
<html>
<head>
    <title>Bank Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Bank Management System</h1>
        <p class="intro">Java project converted into JavaScript</p>

        <div id="accountForm" class="box">
            <h2>Create Bank Account</h2>

            <label>Account Number</label>
            <input type="text" id="accountNumber" placeholder="Enter account number">

            <label>Account Holder Name</label>
            <input type="text" id="name" placeholder="Enter name">

            <label>Initial Balance</label>
            <input type="number" id="initialBalance" min="0" placeholder="Enter initial balance">

            <button onclick="createAccount()">Create Account</button>
        </div>

        <div id="bankOperations" class="box" style="display: none;">
            <h2>Bank Operations</h2>

            <label>Amount</label>
            <input type="number" id="amount" min="0" placeholder="Enter amount">

            <button onclick="depositMoney()">Deposit</button>
            <button onclick="withdrawMoney()">Withdraw</button>
            <button onclick="checkBalance()">Check Balance</button>

            <h3>Account Details</h3>
            <div id="accountDetails" class="details"></div>

            <p id="message" class="message"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
